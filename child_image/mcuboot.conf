CONFIG_MCUBOOT_SERIAL=y
CONFIG_BOOT_SERIAL_CDC_ACM=y
CONFIG_BOOT_SERIAL_DETECT_DELAY=50
CONFIG_MCUBOOT_INDICATION_LED=y
CONFIG_MULTITHREADING=y
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_CDC_ACM=y
CONFIG_USB_DEVICE_PRODUCT="Watch Bootloader"
CONFIG_UART_CONSOLE=n
CONFIG_CONSOLE=n
CONFIG_LOG=n
CONFIG_SIZE_OPTIMIZATIONS=y
CONFIG_PM_PARTITION_SIZE_MCUBOOT=0x10000
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y

# Enter USB mode when the app leaves the boot mode flag
CONFIG_RETAINED_MEM=y
CONFIG_RETENTION=y
CONFIG_RETENTION_BOOT_MODE=y
CONFIG_BOOT_SERIAL_BOOT_MODE=y

# One app slot: USB uploads go straight into it, and the app gets ~950 KB
CONFIG_SINGLE_APPLICATION_SLOT=y

# Bigger USB upload chunks (faster mcumgr uploads)
CONFIG_BOOT_MAX_LINE_INPUT_LEN=8192
CONFIG_BOOT_SERIAL_MAX_RECEIVE_SIZE=8192