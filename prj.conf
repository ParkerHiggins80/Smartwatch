CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n
CONFIG_I2C=y
CONFIG_SPI=y
CONFIG_MAIN_STACK_SIZE=8192

# Added for touch test
CONFIG_GPIO=y
CONFIG_PRINTK=y
CONFIG_CONSOLE=y

# MCUboot + USB bootloader
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_REBOOT=y

# Boot mode: app leaves a "go to USB mode" flag for MCUboot in GPREGRET
CONFIG_RETAINED_MEM=y
CONFIG_RETENTION=y
CONFIG_RETENTION_BOOT_MODE=y

# Use our own crash handler in main.c (freeze screen + fast LED blink)
CONFIG_RESET_ON_FATAL_ERROR=n

# Low-frequency clock: no working 32.768 kHz crystal, use internal RC
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_500PPM=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC_CALIBRATION=y

# Bluetooth
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Watch"
CONFIG_BT_MAX_CONN=1
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=3072
CONFIG_BT_CTLR_CONN_RSSI=y

# Pairing + iPhone Current Time Service
CONFIG_BT_SMP=y
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_GATT_DM=y
CONFIG_BT_CTS_CLIENT=y
CONFIG_HEAP_MEM_POOL_SIZE=2048

# Display driver (src/co5300.c) + LVGL
CONFIG_DISPLAY=y
CONFIG_LVGL=y
CONFIG_LV_MEM_CUSTOM=y
CONFIG_LV_Z_MEM_POOL_SIZE=16384
CONFIG_LV_Z_VDB_SIZE=10
CONFIG_LV_COLOR_DEPTH_16=y
CONFIG_LV_COLOR_16_SWAP=y
CONFIG_LV_USE_LABEL=y
CONFIG_LV_FONT_MONTSERRAT_14=y
CONFIG_LV_FONT_MONTSERRAT_20=y
CONFIG_LV_FONT_MONTSERRAT_28=y
CONFIG_LV_FONT_MONTSERRAT_48=y

# Permanent bonding: save pairing keys in flash (adds settings_storage partition)
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_BT_SETTINGS=y
CONFIG_BT_KEYS_OVERWRITE_OLDEST=y
CONFIG_BT_SMP_ALLOW_UNAUTH_OVERWRITE=y

# Notifications from the iPhone (Apple Notification Center Service)
CONFIG_BT_ANCS_CLIENT=y